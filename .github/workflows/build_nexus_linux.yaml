name: Build Nexus Linux

on:
    workflow_dispatch:
        inputs:
            arch:
                description: "Architecture"
                required: false
                default: "x64"
                type: choice
                options:
                    - x64
                    - arm64

jobs:
    build:
        name: Build Linux ${{ inputs.arch || 'x64' }}
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout element-desktop
              uses: actions/checkout@v4

            - name: Checkout element-web (webapp)
              uses: actions/checkout@v4
              with:
                  repository: r1gzee/element-ptt-web
                  ref: develop
                  path: element-web

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node (web)
              uses: actions/setup-node@v4
              with:
                  node-version-file: element-web/.nvmrc
                  cache: pnpm
                  cache-dependency-path: element-web/pnpm-lock.yaml

            - name: Install element-web deps
              working-directory: element-web
              run: pnpm install --frozen-lockfile

            - name: Build element-web
              working-directory: element-web
              run: pnpm --filter element-web build

            - name: Setup Node (desktop)
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install element-desktop deps
              run: pnpm install --frozen-lockfile

            - name: Copy webapp into desktop
              run: |
                  rm -rf webapp
                  cp -r element-web/apps/web/webapp webapp

            - name: Build TypeScript & resources
              run: pnpm run build:ts && pnpm run build:res

            - name: Package with electron-builder
              env:
                  VARIANT_PATH: element.io/nexus/build.json
              run: |
                  npx electron-builder --linux AppImage deb --${{ inputs.arch || 'x64' }} \
                    --publish never

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: Nexus-Linux-${{ inputs.arch || 'x64' }}
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                  if-no-files-found: error
                  retention-days: 7
